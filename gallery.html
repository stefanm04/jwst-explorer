<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | JWSTExplorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="logo">
        <span class="logo-icon">✦</span> JWSTExplorer
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="discovery.html">Discoveries</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <section class="gallery-hero custom-hero" style="--hero-bg: url('images/background.png');">
        <div class="hero-content">
          <h1>JWST Image Gallery</h1>
          <p> Explore breathtaking views of the cosmos captured by the most powerful space telescope. </p>
          <a href="discovery.html" class="btn">Explore More Discoveries</a>
        </div>
      </section>
      <section class="gallery-section">
        <div class="gallery-container">
          <p class="gallery-note"> All images are courtesy of NASA, ESA, CSA, and the Space Telescope Science Institute. </p>
          <div class="gallery-grid">
            <figure class="gallery-item">
              <img src="images/deep-field.jpg" alt="SMACS 0723 deep field">
              <figcaption>SMACS 0723</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/discovery-cosmic-cliffs.png" alt="NGC 3324 star-forming region">
              <figcaption>NGC 3324 star-forming region</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/gallery-herbig-haro-46-47.jpg" alt="Herbig-Haro 46/47">
              <figcaption>Herbig-Haro 46/47</figcaption>
            </figure>
            <figure class="gallery-item tall">
              <img src="images/pillars-of-creation.png" alt="Pillars of Creation">
              <figcaption>Pillars of Creation</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/discovery-protostar.jpg" alt="HH 30">
              <figcaption>HH 30</figcaption>
            </figure>
            <figure class="gallery-item tall">
              <img src="images/herbig-harro211.jpg" alt="Herbig-Haro 211">
              <figcaption>Herbig-Haro 211 - NIRCam</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/gallery-ngc-5068.jpg" alt="Spiral galaxy NGC 5068">
              <figcaption>Spiral galaxy NGC 5068</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/gallery-ring-nebula.jpg" alt="Ring Nebula">
              <figcaption>Ring Nebula - NIRCam</figcaption>
            </figure>
            <figure class="gallery-item">
              <img src="images/gallery-jupiter.jpg" alt="Wide-field view of Jupiter">
              <figcaption>Wide-field view of Jupiter</figcaption>
            </figure>
          </div>
        </div>
      </section>
      <footer class="site-footer">
        <p>© 2026 JWSTExplorer</p>
      </footer>
    </main>
  </body>
</html>
